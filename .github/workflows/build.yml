name: Build Chaman Browser APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Refresh ad block list (Peter Lowe's list, optional)
        run: |
          set +e
          curl -fsSL --max-time 60 \
            "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=nohtml&showintro=0&mimetype=plaintext" \
            -o "$RUNNER_TEMP/pgl.txt"
          if [ -s "$RUNNER_TEMP/pgl.txt" ]; then
            {
              echo
              echo "# --- Peter Lowe's Ad and tracking server list ---"
              cat "$RUNNER_TEMP/pgl.txt"
            } >> app/src/main/assets/blocklist.txt
            echo "Block list updated: $(wc -l < app/src/main/assets/blocklist.txt) lines"
          else
            echo "Download failed, using the bundled list only"
          fi
          exit 0

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chaman.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/chaman.jks" >> "$GITHUB_ENV"
            echo "Using release signing key"
          else
            echo "No signing key secret found, the APK will be signed with the debug key"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Chaman-Browser.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chaman-Browser
          path: Chaman-Browser.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chaman-Browser.apk
          generate_release_notes: true
